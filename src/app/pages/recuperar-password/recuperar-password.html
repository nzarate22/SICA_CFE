<div class="login-wrapper">
    <div class="login-card">
        <div class="login-header">
            <img src="images/logo-cfe.png" alt="CFE" class="login-logo">
            <h4 class="login-title">SICA-CFE</h4>
            <p class="login-subtitle">Cambiar Contraseña</p>
        </div>

        <div class="login-body">
            <div *ngIf="mensajeError" class="alert alert-danger py-2 border-0 shadow-sm mb-3 small" role="alert">
                <i class="bi bi-exclamation-circle-fill me-2"></i> {{ mensajeError }}
            </div>

            <div *ngIf="mensajeExito" class="alert alert-success py-2 border-0 shadow-sm mb-3 small" role="alert">
                <i class="bi bi-check-circle-fill me-2"></i> {{ mensajeExito }}
            </div>

            <form (ngSubmit)="actualizarPassword()">
                <div class="mb-3">
                    <label class="form-label fw-semibold text-muted small">RPE:</label>
                    <div class="input-group">
                        <span class="input-group-text bg-white border-end-0">
                            <i class="bi bi-person text-success"></i>
                        </span>
                        <input type="text" class="form-control border-start-0 ps-0" 
                               placeholder="Ingresa tu RPE" name="rpe"
                               [(ngModel)]="datos.rpe" required>
                    </div>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-semibold text-muted small">Contraseña Actual:</label>
                    <div class="input-group">
                        <span class="input-group-text bg-white border-end-0">
                            <i class="bi bi-shield-lock text-success"></i>
                        </span>
                        <input [type]="verActual ? 'text' : 'password'" 
                               class="form-control border-start-0 border-end-0 ps-0" 
                               name="claveActual" placeholder="Contraseña vigente"
                               [(ngModel)]="datos.claveActual" required>
                        <button (click)="verActual = !verActual" 
                                class="btn btn-outline-secondary border-start-0 bg-white" 
                                type="button">
                            <i class="bi" [ngClass]="verActual ? 'bi-eye' : 'bi-eye-slash'"></i>
                        </button>
                    </div>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-semibold text-muted small">Nueva Contraseña:</label>
                    <div class="input-group">
                        <span class="input-group-text bg-white border-end-0">
                            <i class="bi bi-lock text-success"></i>
                        </span>
                        <input [type]="verNueva ? 'text' : 'password'" 
                               class="form-control border-start-0 border-end-0 ps-0" 
                               name="nuevaClave" placeholder="Mínimo 8 caracteres"
                               [(ngModel)]="datos.nuevaClave" required>
                        <button (click)="verNueva = !verNueva" 
                                class="btn btn-outline-secondary border-start-0 bg-white" 
                                type="button">
                            <i class="bi" [ngClass]="verNueva ? 'bi-eye' : 'bi-eye-slash'"></i>
                        </button>
                    </div>
                </div>

                <div class="mb-4">
                    <label class="form-label fw-semibold text-muted small">Confirmar Nueva Contraseña:</label>
                    <div class="input-group has-validation">
                        <span class="input-group-text bg-white border-end-0">
                            <i class="bi bi-check2-all text-success"></i>
                        </span>
                        <input [type]="verConfirmar ? 'text' : 'password'" 
                               class="form-control border-start-0 border-end-0 ps-0" 
                               [ngClass]="{
                                 'is-invalid': !contrasenasCoinciden && datos.confirmarClave, 
                                 'is-valid': contrasenasCoinciden && datos.confirmarClave
                               }"
                               name="confirmarClave" placeholder="Repite la nueva contraseña"
                               [(ngModel)]="datos.confirmarClave" required>
                        <button (click)="verConfirmar = !verConfirmar" 
                                class="btn btn-outline-secondary border-start-0 bg-white" 
                                type="button">
                            <i class="bi" [ngClass]="verConfirmar ? 'bi-eye' : 'bi-eye-slash'"></i>
                        </button>
                        <div class="invalid-feedback">
                            Las nuevas contraseñas no coinciden.
                        </div>
                    </div>
                </div>

                <button type="submit" class="btn-login w-100 fw-bold shadow-sm"
                    [disabled]="!datos.rpe || !datos.claveActual || !datos.nuevaClave || !contrasenasCoinciden || cargando">
                    <i class="bi bi-arrow-repeat me-2"></i>
                    {{ cargando ? 'Procesando...' : 'Cambiar Contraseña' }}
                </button>

                <div class="text-center mt-3">
                    <a routerLink="/login" class="text-decoration-none text-success small fw-medium">
                        <i class="bi bi-arrow-left me-1"></i> Cancelar y volver
                    </a>
                </div>
            </form>
        </div>

        <div class="login-footer">
            <span>© 2026 Comisión Federal de Electricidad</span> [cite: 11]
        </div>
    </div>
</div>
