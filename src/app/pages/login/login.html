<app-navbar></app-navbar>

<div class="container d-flex justify-content-center align-items-center" style="min-height: 80vh;">
    <div class="card shadow-lg rounded-4 border-success-cfe" style="width: 100%; max-width: 400px;">
        <div class="card-body p-4">
            <h3 class="text-center mb-4 fw-bold">Acceso SICA</h3>

            <div class="mb-3">
                <label class="form-label fw-semibold">RPE / RTE:</label>
                <div class="input-group">
                    <span class="input-group-text bg-white border-end-0">
                        <i class="bi bi-person-fill" style="color: #008248;"></i>
                    </span>
                    <input type="text" class="form-control border-start-0" placeholder="Ej. 9XXXX">
                </div>
            </div>

            <div class="mb-4">
                <label class="form-label fw-semibold">Contraseña:</label>
                <div class="input-group">
                    <span class="input-group-text bg-white border-end-0">
                        <i class="bi bi-lock-fill" style="color: #008248;"></i>
                    </span>
                    <input type="password" class="form-control border-start-0" placeholder="••••••••">
                </div>
            </div>

            <button (click)="ingresar()" class="btn btn-success-cfe w-100 fw-bold py-2">
                Ingresar
            </button>
        </div>
    </div>
</div>
