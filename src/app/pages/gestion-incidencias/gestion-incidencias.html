<app-navbar></app-navbar>

<div class="container-fluid py-4">
  <div class="d-flex justify-content-end mb-4">
    <button (click)="cerrarSesion()" class="btn btn-cerrar-sica shadow-sm fw-bold">
      <i class="bi bi-box-arrow-right me-2"></i>Cerrar Sesión
    </button>
  </div>

  <div class="card shadow-sm mb-4 border-success-cfe">
    <div class="card-body">
      <div class="row g-3 align-items-end mb-4">
        <div class="col-md-3">
          <label class="form-label fw-bold">RPE:</label>
          <input type="text" class="form-control" [(ngModel)]="rpeBusqueda" placeholder="Ej. 9NJHC">
        </div>

        <div class="col-md-3">
          <label class="form-label fw-bold">Desde:</label>
          <input type="date" class="form-control" [(ngModel)]="fechaInicio">
        </div>

        <div class="col-md-3">
          <label class="form-label fw-bold">Hasta:</label>
          <input type="date" class="form-control" [(ngModel)]="fechaFin">
        </div>

        <div class="col-md-3">
          <button class="btn btn-outline-dark w-100" (click)="buscar()" [disabled]="cargando">
            <i class="bi bi-search"></i> {{ cargando ? 'Buscando...' : 'Buscar' }}
          </button>
        </div>
      </div>
    </div>
  </div>

  <div class="mb-3 px-2">
    <span class="fs-5 fw-bold text-dark">Colaborador:</span>
    <span class="fs-5 ms-2 text-secondary">{{ nombreColaborador }}</span>
  </div>

  <div class="card shadow-sm mb-4">
    <div class="table-responsive">
      <table class="table table-hover align-middle mb-0">
        <thead class="table-light">
          <tr>
            <th class="ps-4">Fecha</th>
            <th>Entrada</th>
            <th>Salida</th>
            <th>Estatus</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let evento of listaEventos">
            <td class="ps-4">{{ evento.fecha }}</td>
            <td>{{ evento.dir === 'IN' ?
